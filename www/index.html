<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2B2B2B">
<title>🧒 Neeksha's Chibi Creator</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="appbar">
  <a class="chip home" href="/" title="All of Neeksha's apps">🏠</a>
  <nav class="tabs">
    <button class="tab on" data-s="sCreate" onclick="go('sCreate')">🎨 Create</button>
    <button class="tab" data-s="sAnime" onclick="go('sAnime')">🔍 Anime</button>
    <button class="tab" data-s="sGallery" onclick="go('sGallery')">📁 Gallery <span class="galCount" id="galCount"></span></button>
  </nav>
</header>

<main id="screens">

  <!-- ══ CREATE ══ -->
  <div class="screen on" id="sCreate">
    <div class="stage"><canvas id="chibi" width="600" height="720"></canvas></div>
    <div class="panel">
      <div class="ctl"><div class="lbl">🎨 Background</div><div class="row" id="bgRow"></div></div>
      <div class="ctl"><div class="lbl">🧑 Skin</div><div class="row" id="skinRow"></div></div>
      <div class="ctl"><div class="lbl">💇 Hair style</div><div class="row" id="hairStyleRow"></div></div>
      <div class="ctl"><div class="lbl">🎨 Hair colour</div><div class="row" id="hairColorRow"></div></div>
      <div class="ctl"><div class="lbl">👀 Eyes</div><div class="row" id="eyeRow"></div></div>
      <div class="ctl"><div class="lbl">👄 Mouth</div><div class="row" id="mouthRow"></div></div>
      <div class="ctl"><div class="lbl">🌸 Cheeks</div><div class="row"><button class="opt" id="blushToggle">blush ✨</button></div></div>
      <div class="ctl"><div class="lbl">👕 Outfit</div><div class="row" id="outfitRow"></div></div>
      <div class="ctl"><div class="lbl">🎀 Accessory</div><div class="row" id="accRow"></div></div>
    </div>
    <div class="actions">
      <button class="act" onclick="randomize()">🎲 Surprise me!</button>
      <button class="act go" onclick="saveChibi()">✨ Save</button>
    </div>
  </div>

  <!-- ══ ANIME SEARCH ══ -->
  <div class="screen" id="sAnime">
    <div class="search-bar">
      <input id="animeSearch" type="search" placeholder="🔍 Search anime characters…" autocomplete="off" oninput="renderAnimeGrid(this.value)">
    </div>
    <div class="anime-grid" id="animeGrid"></div>
  </div>

  <!-- ══ GALLERY ══ -->
  <div class="screen" id="sGallery">
    <div class="gallery-wrap">
      <div class="grid" id="galGrid"></div>
      <div class="empty" id="galEmpty" hidden>
        <div class="ei">🧒</div>
        <p>No saved pictures yet!<br>Make a chibi or render an anime character, then tap save.</p>
        <button class="chip big" onclick="go('sCreate')">Start creating →</button>
      </div>
    </div>
  </div>

</main>

<!-- gallery lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <div class="lb-inner">
    <img id="lbImg" alt="picture">
    <div class="lb-date" id="lbDate"></div>
    <div class="lb-actions">
      <button class="chip" onclick="downloadCurrent()">⬇ Save picture</button>
      <button class="chip danger" id="lbDelete" onclick="deleteCurrent()">🗑️ Delete</button>
      <button class="chip" onclick="closeLightbox()">✦ Close</button>
    </div>
  </div>
</div>

<!-- decorate screen: draw on the anime character -->
<div class="drawscreen" id="sDraw">
  <header class="bar top">
    <button class="chip" onclick="closeDraw()">← Back</button>
    <div class="brand" id="drawTitle">🎨 Decorate</div>
    <button class="chip right go2" onclick="saveDraw()">✨ Save</button>
  </header>
  <div class="draw-stage"><canvas id="drawPad"></canvas></div>
  <div class="draw-tools">
    <div class="row" id="dColors"></div>
    <div class="dtextrow" id="dTextRow" hidden>
      <input id="dText" type="text" maxlength="24" placeholder="type a word…" autocomplete="off">
      <div class="row" id="dFonts"></div>
    </div>
    <div class="tool-row2">
      <div class="row" id="dSizes"></div>
      <div class="row" id="dStamps"></div>
    </div>
    <div class="row dactions">
      <button class="act" id="dBrush" onclick="dSetTool('brush')" title="Brush">🖌️</button>
      <button class="act" id="dGlitter" onclick="dSetTool('glitter')" title="Glitter">✨</button>
      <button class="act" id="dTextBtn" onclick="dSetTool('text')" title="Text">🅰️</button>
      <button class="act" onclick="glossify()" title="Add gloss">💧</button>
      <button class="act" id="dErase" onclick="dSetTool('erase')" title="Eraser">🧽</button>
      <button class="act" onclick="dUndo()" title="Undo">↩️</button>
      <button class="act" onclick="dClear()" title="Clear doodles">🗑️</button>
      <button class="act" onclick="downloadDraw()" title="Download">⬇</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/anime-list.js"></script>
<script src="js/store.js"></script>
<script src="js/chibi.js"></script>
<script src="js/controls.js"></script>
<script src="js/anime.js"></script>
<script src="js/draw.js"></script>
<script src="js/gallery.js"></script>
<script src="js/app.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
